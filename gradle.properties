# Project-wide Gradle settings for the dukaaon app

# Kotlin version
kotlin.version=1.9.25

# Android config
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.resvalues=true

# Force AndroidX and disable support libraries completely
# android.suppressUnsupportedCompileSdk=35
# android.disableAutomaticComponentCreation=true
# android.suppressUnsupportedOptionWarnings=true
android.compileSdkVersion=35
android.targetSdkVersion=35
android.minSdkVersion=24

# Android 15 compatibility
android.enableR8.fullMode=true
android.enableR8=true
android.enableDexingArtifactTransform=false
android.enableDexingArtifactTransform.desugaring=false

# 16KB page size support - Critical for Android 15
# Required for Google Play compatibility starting November 1, 2025
# See: https://developer.android.com/guide/practices/page-sizes#build
android.bundle.enableUncompressedNativeLibs=false
android.enableSeparateBuildPerCPUArchitecture=true
android.bundle.language.enableSplit=false
android.bundle.density.enableSplit=false

# Native library alignment for 16KB pages
# Ensures native libraries (.so files) are aligned to 16 KB boundaries
android.native.useEmbeddedDependencies=true
android.enableNativeLibraryAlignment=true
android.bundle.nativeLibsAlignment=16384

# Zipalign configuration for 16 KB alignment
# APK/AAB files must be zipaligned with 16 KB alignment for 16 KB page size support
android.bundle.zipalign.enabled=true
android.bundle.zipalign.alignment=16384

# Edge-to-edge support
android.enableEdgeToEdge=true
android.buildToolsVersion=35.0.0

# Expo updates
expo.updates.enabled=false

# App Auth Redirect Scheme

# Keystore configuration for release builds
# Keystore passwords for dukaaon_upload_new.jks
KEYSTORE_PASSWORD=dukaaon
KEY_PASSWORD=dukaaon

# Dependency resolution for namespace conflicts
android.forceResolveConflicts=true
android.excludeGroups=com.android.support
android.enableResourceNamespacing=true
android.nonTransitiveRClass=true
android.enableNewResourceProcessing=true

# Force AndroidX over support libraries
android.overridePathCheck=true
android.suppressUnsupportedOptionWarnings=true
android.enableIncrementalAnnotationProcessing=false

# Gradle config
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false
org.gradle.caching=false

# Additional Android build optimizations
android.enableBuildCache=false
android.enableSeparateAnnotationProcessing=true
android.enableIncrementalDesugaring=false

# Duplicate class handling
android.enableDuplicateClassesCheck=false
android.suppressUnsupportedOptionWarnings=true
android.suppressUnsupportedCompileSdk=35

# Jetifier configuration - force AndroidX migration
android.jetifier.blacklist=com.android.support
android.jetifier.ignorelist=com.android.support

# Ultimate conflict resolution
# android.disableAutomaticComponentCreation=true
# android.suppressUnsupportedOptionWarnings=true
# android.suppressUnsupportedCompileSdk=35
android.experimental.enableSourceSetPathsMap=false
android.experimental.enableParallelJsonSubsetExtraction=false
android.experimental.enableNewResourceShrinker=false
android.experimental.enableResourceOptimizations=false
android.experimental.enableIncrementalDesugaring=false
android.experimental.enableDexArchives=false
android.experimental.enableSeparateAnnotationProcessing=false
android.experimental.enableIncrementalKapt=false
android.experimental.enableAapt2JniWorkaround=false
android.experimental.enableProfileJson=false
android.experimental.enableParallelJsonSubsetExtraction=false

# Disable problematic features
android.enableBuildCache=false
android.enableSeparateAnnotationProcessing=false
android.enableIncrementalDesugaring=false
android.enableDexArchives=false
android.enableAapt2=true
android.enableAapt2JniWorkaround=false

# Force clean builds
org.gradle.caching=false
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.unsafe.configuration-cache=false

# Memory and performance
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.workers.max=4
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# Nuclear exclusions - Completely prevent support library resolution
android.dependency.excludeGroups=com.android.support
android.dependency.forceReplace=true
android.dependency.strictMode=true
android.dependency.failOnConflict=true
android.dependency.rejectSupportLibraries=true

# Force clean dependency resolution
org.gradle.dependency.verification=off
org.gradle.dependency.locking=false
org.gradle.dependency.cache.cleanup=true
org.gradle.dependency.resolution.strict=true

# Additional safety measures
android.experimental.enableNewResourceShrinker=false
android.experimental.enableResourceOptimizations=false
android.experimental.enableIncrementalDesugaring=false
android.experimental.enableDexArchives=false
android.experimental.enableSeparateAnnotationProcessing=false
android.experimental.enableIncrementalKapt=false
android.experimental.enableAapt2JniWorkaround=false
android.experimental.enableProfileJson=false
android.experimental.enableParallelJsonSubsetExtraction=false
android.experimental.enableSourceSetPathsMap=false

# Force AndroidX only
android.forceAndroidXOnly=true
android.rejectSupportLibraries=true
android.enableStrictDependencyChecking=true