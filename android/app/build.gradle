// CRITICAL: Intercept plugin application BEFORE autolinking runs
// This must be at the very top, before any plugins are applied
// We need to intercept at the PluginContainer level to catch all plugin applications
def pluginContainer = project.extensions.findByType(org.gradle.api.plugins.PluginContainer)
if (pluginContainer) {
    def originalApply = pluginContainer.&apply
    pluginContainer.metaClass.apply = { String pluginId ->
        // Block library plugins for app module
        if ((pluginId == 'com.android.library' || pluginId == 'com.android.internal.library') && project.name == 'app') {
            println "⚠️  BLOCKED: Skipping library plugin '${pluginId}' application to app module (already has application plugin)"
            return null
        }
        try {
            return originalApply(pluginId)
        } catch (Exception e) {
            // If it's a library plugin conflict, ignore it silently
            if ((pluginId == 'com.android.library' || pluginId == 'com.android.internal.library') && 
                (e.message?.contains('com.android.application') || e.message?.contains('cannot be applied in the same project'))) {
                println "⚠️  CAUGHT: Library plugin conflict ignored: ${e.message}"
                return null
            }
            throw e
        }
    }
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
     //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = (findProperty('android.enableProguardInReleaseBuilds') ?: false).toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

// Exclude old support libraries globally to prevent duplicate classes
configurations.all {
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'support-v4'
    exclude group: 'com.android.support', module: 'versionedparcelable'
    exclude group: 'com.android.support', module: 'animated-vector-drawable'
    exclude group: 'com.android.support', module: 'support-vector-drawable'
    exclude group: 'com.android.support'
    
    resolutionStrategy {
        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'com.android.support') {
                if (details.requested.name == 'support-compat') {
                    details.useTarget 'androidx.core:core:1.16.0'
                } else if (details.requested.name == 'versionedparcelable') {
                    details.useTarget 'androidx.versionedparcelable:versionedparcelable:1.1.1'
                } else {
                    throw new GradleException("Support library ${details.requested.group}:${details.requested.name} must be replaced with AndroidX")
                }
            }
        }
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.sixn8.dukaaon'
    defaultConfig {
        applicationId 'com.sixn8.dukaaon'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 52
        versionName "1.0.0"
        
        // 16 KB page size support - NDK 26 workaround
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384"
            }
        }
    }

    // ABI Splits - Generate separate APKs per architecture for smaller download size
    // Note: All ABIs support 16 KB page sizes with NDK 28+
    splits {
        abi {
            reset()
            enable true
            universalApk false // Don't generate universal APK
            include "armeabi-v7a", "arm64-v8a" // Only ARM architectures for production
        }
    }
    
    // Assign version codes per ABI for proper Google Play publishing
    // Note: ABI splits only apply to APKs, not AABs. AABs use the base versionCode.
    project.ext.versionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 4]
    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            // Only apply version code override for APK outputs, not for AAB bundles
            if (output.outputFile != null && output.outputFile.name.endsWith('.apk')) {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                if (abi != null) {
                    output.versionCodeOverride = variant.versionCode * 10 + project.ext.versionCodes.get(abi, 0)
                }
            }
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystorePass = findProperty('KEYSTORE_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            def keyPass = findProperty('KEY_PASSWORD') ?: System.getenv('KEY_PASSWORD')
            def keystoreFile = file('../../credentials/android/dukaaon_upload_new.jks')
            
            if (!keystoreFile.exists()) {
                throw new GradleException("Keystore file not found at: ${keystoreFile.absolutePath}")
            }
            
            if (!keystorePass || !keyPass) {
                throw new GradleException("Keystore passwords not found. Please set KEYSTORE_PASSWORD and KEY_PASSWORD in gradle.properties")
            }
            
            storeFile keystoreFile
            storePassword keystorePass
            keyAlias 'dukaaon_upload'
            keyPassword keyPass
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use production keystore for release builds
            signingConfig signingConfigs.release
            shrinkResources (findProperty('android.enableShrinkResourcesInReleaseBuilds')?.toBoolean() ?: false)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }
    packagingOptions {
        jniLibs {
            // CRITICAL: useLegacyPackaging MUST be false for 16 KB page size support
            // Legacy packaging doesn't support 16 KB alignment
            // This is required for Google Play compatibility with Android 15+
            useLegacyPackaging false
        }
        // Pick first for AndroidX classes to resolve conflicts with old support libraries
        // This ensures AndroidX versions are used instead of old support library versions
        pickFirst 'androidx/core/**'
        pickFirst 'androidx/versionedparcelable/**'
        pickFirst 'android/support/v4/app/INotificationSideChannel.class'
        pickFirst 'android/support/v4/app/INotificationSideChannel$*.class'
        pickFirst 'android/support/v4/graphics/drawable/IconCompatParcelizer.class'
        pickFirst 'android/support/v4/os/IResultReceiver.class'
        pickFirst 'android/support/v4/os/IResultReceiver$*.class'
        pickFirst 'android/support/v4/os/ResultReceiver.class'
        pickFirst 'android/support/v4/os/ResultReceiver$*.class'
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android") {
        exclude group: 'com.android.support'
    }

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply plugin: 'com.google.gms.google-services'