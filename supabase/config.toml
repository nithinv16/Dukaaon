
# Firebase Third-party Authentication Configuration
# Disabled in favor of custom access token hook approach
# [auth.third_party.firebase]
# enabled = true
# project_id = "dukaaon"

# Custom Access Token Hook Configuration
# Disabled - not needed for native Supabase phone authentication
[auth.hook.custom_access_token]
enabled = false
uri = "pg-functions://postgres/public/custom_access_token_hook"

# Send SMS Hook Configuration
# This hook provides custom SMS handling for OTP delivery
[auth.hook.send_sms]
enabled = false
uri = "https://xcpznnkpjgyrpbvpnvit.supabase.co/functions/v1/sms-hook"

[functions.check-profile]
enabled = true
verify_jwt = true
import_map = "./functions/check-profile/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/check-profile/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/check-profile/*.html" ]

[functions.sms-hook]
enabled = true
verify_jwt = false
import_map = "./functions/sms-hook/deno.json"
entrypoint = "./functions/sms-hook/index.ts"

[functions.razorpay-function]
enabled = true
verify_jwt = true
import_map = "./functions/razorpay-function/deno.json"
entrypoint = "./functions/razorpay-function/index.ts"

[functions.verify-razorpay-payment]
enabled = true
verify_jwt = true
import_map = "./functions/verify-razorpay-payment/deno.json"
entrypoint = "./functions/verify-razorpay-payment/index.ts"

[functions.whatsapp-webhook]
enabled = true
verify_jwt = false  # Webhook from Authkey doesn't have JWT
import_map = "./functions/whatsapp-webhook/deno.json"
entrypoint = "./functions/whatsapp-webhook/index.ts"

# ---------------------------------------------------------------------------
# AI proxies.
#
# These exist so that no AWS credential is ever present in the client bundle.
# Anything with an EXPO_PUBLIC_ prefix is inlined by Metro as a string literal
# and is recoverable from a shipped APK, so the previous direct-from-client
# Azure/AWS/Google calls were effectively publishing their keys.
#
# All three require a verified JWT and additionally enforce a per-user quota via
# consume_ai_rate_limit (see 20250713000000_ai_proxy_rate_limits.sql), because
# authentication alone does not bound spend on a paid API.
#
# Required function secrets:
#   supabase secrets set AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_REGION=...
# ---------------------------------------------------------------------------

[functions.ai-translate]
enabled = true
verify_jwt = true
import_map = "./functions/ai-translate/deno.json"
entrypoint = "./functions/ai-translate/index.ts"

[functions.ai-ocr]
enabled = true
verify_jwt = true
import_map = "./functions/ai-ocr/deno.json"
entrypoint = "./functions/ai-ocr/index.ts"

[functions.ai-chat]
enabled = true
verify_jwt = true
import_map = "./functions/ai-chat/deno.json"
entrypoint = "./functions/ai-chat/index.ts"
